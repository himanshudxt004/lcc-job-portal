<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | LCC Job Portal</title>
  <meta name="description" content="Sign in to Lead Connects Career — Job Seeker or Employer." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="login">

  <section class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <a href="index.html" class="logo" style="justify-content:center; display:inline-flex; margin-bottom:14px;">
          <div class="logo-icon">L</div>
          <div class="logo-text">LCC<span>Career</span></div>
        </a>
        <span class="section-tag">Welcome Back</span>
        <h1>Sign in to LCC</h1>
        <p>Access your dashboard, jobs and applications.</p>
      </div>

      <!-- Role tabs -->
      <div class="role-tabs" role="tablist">
        <button type="button" class="role-tab" data-role="jobseeker"><span class="ico">👤</span> Job Seeker</button>
        <button type="button" class="role-tab" data-role="employer"><span class="ico">🏢</span> Employer</button>
      </div>

      <div id="authFeedback" class="auth-feedback"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <input type="hidden" name="role" value="jobseeker" />

        <div class="form-group">
          <label for="li-email">Email</label>
          <input id="li-email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="li-password">Password</label>
          <input id="li-password" name="password" type="password" placeholder="Your password" required />
        </div>

        <button type="submit" class="btn-primary auth-cta">Sign In →</button>

        <div class="auth-foot">
          New to LCC? <a href="signup.html">Create an account</a>
        </div>
      </form>
    </div>
  </section>

  <div style="text-align:center; padding-bottom:30px; background:var(--navy);">
    <a href="index.html" class="auth-back">← Back to Home</a>
  </div>

  <script>
    // window.LCC_API_BASE = 'http://localhost:5000/api';   // override if needed
  </script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
