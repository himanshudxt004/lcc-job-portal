<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Job | LCC Employer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-page="dashboard">

  <div data-include="header"></div>

  <section class="app-shell">
    <div class="app-container" style="max-width:760px;">

      <div style="margin-bottom: 24px;">
        <a href="dashboard-employer.html" class="btn-secondary btn-sm">← Back to Dashboard</a>
      </div>

      <div class="app-head">
        <div>
          <h1 id="pageTitle">Post a New Job</h1>
          <div class="sub">Reach LCC's pre-vetted candidate network — typically filled in 14 days.</div>
        </div>
      </div>

      <div class="card-block">
        <form id="jobForm">
          <div class="form-row">
            <div class="form-group">
              <label for="j-title">Job Title *</label>
              <input id="j-title" name="title" type="text" placeholder="e.g. Full-Stack Developer" required />
            </div>
            <div class="form-group">
              <label for="j-company">Company Name</label>
              <input id="j-company" name="company" type="text" placeholder="Defaults to your registered company" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="j-location">Location *</label>
              <input id="j-location" name="location" type="text" placeholder="Lucknow / Remote / Mumbai" required />
            </div>
            <div class="form-group">
              <label for="j-salary">Salary</label>
              <input id="j-salary" name="salary" type="text" placeholder="e.g. 5-8 LPA" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="j-type">Type</label>
              <select id="j-type" name="type">
                <option>Full-Time</option>
                <option>Part-Time</option>
                <option>Contract</option>
                <option>Temporary</option>
                <option>Internship</option>
              </select>
            </div>
            <div class="form-group">
              <label for="j-industry">Industry</label>
              <select id="j-industry" name="industry">
                <option>Information Technology</option>
                <option>Banking &amp; Financial Services</option>
                <option>Healthcare &amp; Life Sciences</option>
                <option>Retail &amp; Consumer Goods</option>
                <option>Manufacturing</option>
                <option>Education</option>
                <option>HR / Operations</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="j-experience">Experience</label>
              <input id="j-experience" name="experience" type="text" placeholder="e.g. 0-2 years, Fresher, Senior" />
            </div>
            <div class="form-group">
              <label for="j-skills">Skills (comma separated)</label>
              <input id="j-skills" name="skills" type="text" placeholder="JavaScript, React, MongoDB" />
            </div>
          </div>

          <div class="form-group">
            <label for="j-desc">Job Description *</label>
            <textarea id="j-desc" name="description" placeholder="Roles, responsibilities, must-haves, perks..." required style="min-height:200px;"></textarea>
          </div>

          <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
            <button type="submit" class="btn-primary" id="submitBtn">Publish Job →</button>
            <a href="dashboard-employer.html" class="btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </section>

  <div data-include="footer"></div>
  <div id="toast" class="toast"></div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard-common.js"></script>
  <script src="js/post-job.js"></script>
</body>
</html>
